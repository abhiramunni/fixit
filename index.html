<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FixIt — Home Maintenance, Sorted</title>
<meta name="description" content="Every appliance, every service date, every rupee. FixIt keeps your whole home running — services, warranties, filters and repair costs in one tidy workbench.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf5ec; --paper2:#f3e9d7; --card:#fffdf7; --ink:#2b1d12; --ink2:#6b5844; --ink3:#9a8468;
  --line:#e6d9c2; --line2:#d9c6a4; --bronze:#b07d3c; --bronze-d:#8a5f27; --amber:#e8a33d;
  --terra:#c05b2e; --red:#b3402a; --ok:#8a6d2f; --soon:#c07f1a; --shadow:0 10px 30px rgba(43,29,18,.10);
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;line-height:1.12;letter-spacing:-.01em}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
a{color:var(--bronze-d)}
::selection{background:var(--amber);color:var(--ink)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.muted{color:var(--ink2)} .small{font-size:13px} .tiny{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line2);background:#fff}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.st-overdue{color:var(--red);border-color:#ecc9bf;background:#fdf1ec}
.st-soon{color:var(--soon);border-color:#ecd9ac;background:#fdf6e3}
.st-ok{color:var(--ok);border-color:#ddd2ae;background:#fbf7e6}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:12px 18px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:#fdf8ee;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(43,29,18,.22)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#2b1d12}
.btn.terra{background:var(--terra);border-color:var(--terra);color:#fff}
.btn.sm{padding:8px 13px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.icon{width:18px;height:18px;flex:none}
.icon.lg{width:26px;height:26px}
/* ---- cinematic intro ---- */
#intro{position:fixed;inset:0;z-index:200;background:radial-gradient(120% 120% at 50% 0%,#4a2f1a 0%,#2b1d12 55%,#1d120a 100%);color:#f7ead2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .6s ease,visibility .6s}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
#intro .logo-mark{width:92px;height:92px;border-radius:26px;background:linear-gradient(145deg,#e8a33d,#c05b2e);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:logoIn 1s cubic-bezier(.2,.9,.3,1.2) both}
#intro .logo-mark svg{width:52px;height:52px;color:#fff8ec}
@keyframes logoIn{from{transform:scale(.5) rotate(-18deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
#intro h1{font-size:clamp(44px,9vw,76px);color:#fdf6e6;margin-top:26px;animation:rise .8s .25s ease both}
#intro .tag{font-size:17px;color:#e5cfa8;margin-top:10px;animation:rise .8s .45s ease both}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
#introBarWrap{width:min(300px,70vw);height:5px;border-radius:99px;background:rgba(255,255,255,.18);margin-top:34px;overflow:hidden;animation:rise .8s .6s ease both}
#introBar{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#e8a33d,#c98a4b)}
#introSkip{margin-top:26px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#d8c49c;border:1px solid rgba(255,255,255,.28);padding:9px 18px;border-radius:99px;animation:rise .8s .7s ease both}
#introSkip:hover{color:#fff;border-color:#fff}
/* ---- topbar ---- */
.topbar{position:sticky;top:0;z-index:60;background:rgba(250,245,236,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:14px;padding:13px 0}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink)}
.brand-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#e8a33d,#c05b2e);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(192,91,46,.35)}
.brand-mark svg{width:23px;height:23px;color:#fff8ec}
.brand b{font-family:'Fraunces',serif;font-size:22px;letter-spacing:-.01em}
.brand span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.att-chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:8px 13px;border-radius:99px;background:#fdf1ec;color:var(--red);border:1px solid #ecc9bf}
.att-chip.calm{background:#fbf7e6;color:var(--ok);border-color:#ddd2ae}
.date-chip{font-size:13px;font-weight:600;color:var(--ink2)}
/* ---- hero ---- */
.hero{position:relative;margin-top:22px;border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}
.hero-photo{position:relative;height:400px;overflow:hidden}
.hero-photo img{width:100%;height:100%;object-fit:cover;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translateX(0)}to{transform:scale(1.12) translateX(-1.5%)}}
.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(29,18,10,.05) 0%,rgba(29,18,10,.42) 62%,rgba(29,18,10,.78) 100%)}
.hero-copy{position:absolute;left:0;right:0;bottom:0;padding:28px 30px;color:#fdf6e6;z-index:2}
.hero-copy h1{font-size:clamp(34px,6vw,54px);max-width:640px}
.hero-copy p{margin-top:10px;font-size:16.5px;color:#f0ddba;max-width:560px}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hero-stat{background:rgba(255,253,247,.14);border:1px solid rgba(255,255,255,.32);backdrop-filter:blur(6px);border-radius:14px;padding:10px 16px}
.hero-stat b{display:block;font-family:'Fraunces',serif;font-size:22px;line-height:1.1}
.hero-stat span{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:#ecd9ae}
/* ---- attention board ---- */
.attention{margin-top:-34px;position:relative;z-index:3}
.att-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px}
.att-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.att-head h2{font-size:24px}
.att-counts{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.count-chip{border-radius:12px;padding:8px 13px;font-size:13px;font-weight:700;border:1px solid var(--line2);background:var(--paper)}
.count-chip b{font-family:'Fraunces',serif;font-size:18px;margin-right:4px}
.count-chip.over{color:var(--red)} .count-chip.soon{color:var(--soon)} .count-chip.ok{color:var(--ok)}
.att-list{margin-top:14px;display:grid;gap:9px}
.att-row{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:13px;background:#fff}
.att-row .a-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--paper2);color:var(--bronze-d);flex:none}
.att-row .a-ic svg{width:21px;height:21px}
.att-row .a-tx{flex:1;min-width:0}
.att-row .a-tx b{font-size:15px}
.att-row .a-tx span{display:block;font-size:13px;color:var(--ink2)}
.att-row .a-when{font-size:13px;font-weight:700;white-space:nowrap}
.att-row.over .a-when{color:var(--red)} .att-row.soon .a-when{color:var(--soon)}
.att-empty{padding:16px;text-align:center;color:var(--ink2);font-size:14px}
/* ---- sections ---- */
section.block{margin-top:46px}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sec-head h2{font-size:29px}
.sec-head .kicker{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--terra)}
.sec-sub{color:var(--ink2);font-size:15px;max-width:640px;margin-bottom:18px}
.sec-head .right{margin-left:auto}
/* ---- pegboard ---- */
.pegboard{background:linear-gradient(180deg,#f6ecd8,#f1e4cb);border:1px solid var(--line2);border-radius:24px;padding:24px 22px 26px;background-image:radial-gradient(circle,#d3bd93 1.2px,transparent 1.4px);background-size:24px 24px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.fchip{font-size:13px;font-weight:700;padding:9px 15px;border-radius:99px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink2);transition:all .15s}
.fchip:hover{border-color:var(--bronze)}
.fchip.on{background:var(--ink);color:#fdf8ee;border-color:var(--ink)}
.peg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px}
.ap-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 6px 18px rgba(43,29,18,.07);transition:transform .18s ease,box-shadow .18s ease;position:relative}
.ap-card:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 14px 30px rgba(43,29,18,.14)}
.ap-top{display:flex;gap:12px;align-items:flex-start}
.ap-ic{width:46px;height:46px;border-radius:13px;background:var(--paper2);color:var(--bronze-d);display:flex;align-items:center;justify-content:center;flex:none}
.ap-ic svg{width:26px;height:26px}
.ap-top h3{font-size:18px;line-height:1.2}
.ap-top .meta{font-size:12.5px;color:var(--ink2);margin-top:2px}
.ap-ring{margin-left:auto;flex:none;width:64px;height:64px;position:relative;text-align:center}
.ap-ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ap-ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ap-ring .rv b{font-size:11px;line-height:1.1}
.ap-ring .rv span{font-size:8px;letter-spacing:.05em;color:var(--ink3);font-weight:700}
.ap-mid{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.ap-dates{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.7}
.ap-dates b{color:var(--ink);font-weight:700}
.ap-actions{display:flex;gap:8px;margin-top:14px}
.ap-actions .btn{flex:1;justify-content:center;padding:9px 10px;font-size:13px}
.link-btn{font-size:13px;font-weight:700;color:var(--bronze-d);text-decoration:underline;text-underline-offset:3px;padding:9px 4px}
.link-btn:hover{color:var(--terra)}

/* ---- 90-day timeline ---- */
.cal-wrap{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--line2)}
.tl-item{position:relative;padding:0 0 18px 14px}
.tl-item::before{content:"";position:absolute;left:-24px;top:5px;width:14px;height:14px;border-radius:50%;border:3px solid var(--paper);background:var(--bronze);box-shadow:0 0 0 2px var(--line2)}
.tl-item.over::before{background:var(--red)}
.tl-item.soon::before{background:var(--amber)}
.tl-date{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--terra)}
.tl-item h3{font-size:18px;margin-top:2px}
.tl-item p{font-size:13.5px;color:var(--ink2)}
.tl-item .when{font-size:12.5px;font-weight:700;color:var(--bronze-d)}
.cal-side{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);position:sticky;top:76px}
.cal-side h3{font-size:19px;margin-bottom:4px}
.cal-side p{font-size:14px;color:var(--ink2)}
.cal-side .big{font-family:'Fraunces',serif;font-size:44px;line-height:1;color:var(--terra);margin:12px 0 2px}
.cal-side .rule{border-top:1px dashed var(--line2);margin:14px 0;padding-top:12px;font-size:13.5px;color:var(--ink2);line-height:1.7}
.cal-side .rule b{color:var(--ink)}
/* ---- warranty wall ---- */
.war-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.war-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center}
.war-card.exp{border-color:#ecc9bf;background:#fdf6f2}
.war-ring{flex:none;width:74px;height:74px;position:relative}
.war-ring svg{width:74px;height:74px;transform:rotate(-90deg)}
.war-ring .wv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.war-ring .wv b{font-size:15px;line-height:1}
.war-ring .wv span{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700}
.war-card h4{font-size:15.5px;line-height:1.25}
.war-card p{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.5}
/* ---- consumables ---- */
.cons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cons-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px 18px}
.cons-top{display:flex;align-items:center;gap:10px}
.cons-top h4{font-size:16px;flex:1}
.cons-bar{height:9px;border-radius:99px;background:var(--paper2);margin:13px 0 8px;overflow:hidden}
.cons-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--bronze),var(--amber))}
.cons-bar.over i{background:linear-gradient(90deg,var(--red),var(--terra))}
.cons-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);gap:8px;flex-wrap:wrap}
.cons-meta b{color:var(--ink)}
.cons-card .btn{margin-top:12px}
.kit-card{border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);position:relative;margin-top:18px}
.kit-card img{width:100%;height:210px;object-fit:cover;animation:kb 30s ease-in-out infinite alternate}
.kit-card .kit-cap{position:absolute;left:0;right:0;bottom:0;padding:18px 20px;background:linear-gradient(180deg,transparent,rgba(29,18,10,.82));color:#fdf6e6}
.kit-card .kit-cap h3{font-size:21px}
.kit-card .kit-cap p{font-size:13.5px;color:#ecd9ae;margin-top:4px}
/* @@NEXT@@ */
